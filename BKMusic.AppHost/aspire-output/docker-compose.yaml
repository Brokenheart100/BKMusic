services:
  bkmusic-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "8080:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  redis:
    image: "docker.io/library/redis:8.2"
    command:
      - "-c"
      - "redis-server --requirepass $$REDIS_PASSWORD --save 60 1"
    entrypoint:
      - "/bin/sh"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    expose:
      - "6379"
    volumes:
      - type: "volume"
        target: "/data"
        source: "bkmusic.apphost-34c3f7955b-redis-data"
        read_only: false
    networks:
      - "aspire"
  messaging:
    image: "docker.io/library/rabbitmq:4.2-management"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "${MESSAGING_PASSWORD}"
    expose:
      - "5672"
      - "15672"
    volumes:
      - type: "volume"
        target: "/var/lib/rabbitmq"
        source: "bkmusic.apphost-34c3f7955b-messaging-data"
        read_only: false
    networks:
      - "aspire"
  typesense:
    image: "typesense/typesense:29.0"
    command:
      - "--data-dir"
      - "/data"
      - "--api-key"
      - "xyz"
      - "--enable-cors"
    ports:
      - "8108:8108"
    volumes:
      - type: "volume"
        target: "/data"
        source: "typesense-data"
        read_only: false
    networks:
      - "aspire"
  postgres:
    image: "docker.io/library/postgres:17.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql/data"
        source: "pgsql_data"
        read_only: false
    networks:
      - "aspire"
  minio:
    image: "minio/minio:latest"
    command:
      - "server"
      - "/data"
      - "--console-address"
      - ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASS}"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    expose:
      - "9000"
      - "9001"
    volumes:
      - type: "volume"
        target: "/data"
        source: "minio-data"
        read_only: false
    networks:
      - "aspire"
  identity-svc:
    image: "${IDENTITY_SVC_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080;8080"
      ConnectionStrings__identity-db: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=identity-db"
      IDENTITY_DB_HOST: "postgres"
      IDENTITY_DB_PORT: "5432"
      IDENTITY_DB_USERNAME: "postgres"
      IDENTITY_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      IDENTITY_DB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/identity-db"
      IDENTITY_DB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/identity-db"
      IDENTITY_DB_DATABASENAME: "identity-db"
      ConnectionStrings__messaging: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "guest"
      MESSAGING_PASSWORD: "${MESSAGING_PASSWORD}"
      MESSAGING_URI: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      Jwt__Key: "SuperSecretKey1234567890_MustBeLongEnough"
      Jwt__Issuer: "BKMusic_Identity"
      Jwt__Audience: "BKMusic_Client"
      ASPNETCORE_URLS: "http://+:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://BKMusic-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "identity-svc"
    expose:
      - "8080"
    depends_on:
      messaging:
        condition: "service_started"
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  media-svc:
    image: "${MEDIA_SVC_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      ConnectionStrings__media-db: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=media-db"
      MEDIA_DB_HOST: "postgres"
      MEDIA_DB_PORT: "5432"
      MEDIA_DB_USERNAME: "postgres"
      MEDIA_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      MEDIA_DB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/media-db"
      MEDIA_DB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/media-db"
      MEDIA_DB_DATABASENAME: "media-db"
      ConnectionStrings__messaging: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "guest"
      MESSAGING_PASSWORD: "${MESSAGING_PASSWORD}"
      MESSAGING_URI: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MINIO_API: "http://minio:9000"
      services__minio__api__0: "http://minio:9000"
      ConnectionStrings:minio: "http://minio:9000"
      Jwt__Key: "SuperSecretKey1234567890_MustBeLongEnough"
      Jwt__Issuer: "BKMusic_Identity"
      Jwt__Audience: "BKMusic_Client"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://BKMusic-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "media-svc"
    expose:
      - "8080"
    depends_on:
      messaging:
        condition: "service_started"
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  catalog-svc:
    image: "${CATALOG_SVC_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      ConnectionStrings__catalog-db: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=catalog-db"
      CATALOG_DB_HOST: "postgres"
      CATALOG_DB_PORT: "5432"
      CATALOG_DB_USERNAME: "postgres"
      CATALOG_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      CATALOG_DB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/catalog-db"
      CATALOG_DB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/catalog-db"
      CATALOG_DB_DATABASENAME: "catalog-db"
      ConnectionStrings__messaging: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "guest"
      MESSAGING_PASSWORD: "${MESSAGING_PASSWORD}"
      MESSAGING_URI: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      MinIO__PublicHost: "http://localhost:9000"
      Jwt__Key: "SuperSecretKey1234567890_MustBeLongEnough"
      Jwt__Issuer: "BKMusic_Identity"
      Jwt__Audience: "BKMusic_Client"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://BKMusic-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "catalog-svc"
    expose:
      - "8080"
    depends_on:
      messaging:
        condition: "service_started"
      postgres:
        condition: "service_started"
      redis:
        condition: "service_started"
    networks:
      - "aspire"
  transcoding-worker:
    image: "${TRANSCODING_WORKER_IMAGE}"
    environment:
      ConnectionStrings__messaging: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "guest"
      MESSAGING_PASSWORD: "${MESSAGING_PASSWORD}"
      MESSAGING_URI: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      ConnectionStrings:minio: "http://minio:9000"
    depends_on:
      messaging:
        condition: "service_started"
    networks:
      - "aspire"
  search-svc:
    image: "${SEARCH_SVC_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      ConnectionStrings__messaging: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "guest"
      MESSAGING_PASSWORD: "${MESSAGING_PASSWORD}"
      MESSAGING_URI: "amqp://guest:${MESSAGING_PASSWORD}@messaging:5672"
      TYPESENSE_TYPESENSE: "http://typesense:8108"
      services__typesense__typesense__0: "http://typesense:8108"
      Typesense__ApiKey: "xyz"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://BKMusic-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "search-svc"
    expose:
      - "8080"
    depends_on:
      typesense:
        condition: "service_started"
      messaging:
        condition: "service_started"
    networks:
      - "aspire"
  gateway:
    image: "${GATEWAY_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080;8087"
      IDENTITY_SVC_HTTP: "http://identity-svc:8080"
      services__identity-svc__http__0: "http://identity-svc:8080"
      IDENTITY_SVC_HTTPS: "https://identity-svc:8080"
      IDENTITY_SVC_HTTPNX: "http://identity-svc:8080"
      services__identity-svc__httpNx__0: "http://identity-svc:8080"
      MEDIA_SVC_HTTP: "http://media-svc:8080"
      services__media-svc__http__0: "http://media-svc:8080"
      MEDIA_SVC_HTTPS: "https://media-svc:8080"
      CATALOG_SVC_HTTP: "http://catalog-svc:8080"
      services__catalog-svc__http__0: "http://catalog-svc:8080"
      CATALOG_SVC_HTTPS: "https://catalog-svc:8080"
      SEARCH_SVC_HTTP: "http://search-svc:8080"
      services__search-svc__http__0: "http://search-svc:8080"
      SEARCH_SVC_HTTPS: "https://search-svc:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://BKMusic-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "gateway"
    ports:
      - "8080"
      - "8765:8087"
    networks:
      - "aspire"
  vue:
    image: "${VUE_IMAGE}"
    environment:
      NODE_ENV: "production"
      VITE_API_BASE_URL: "http://localhost:8765"
      PORT: "8000"
      GATEWAY_HTTP: "http://gateway:8080"
      services__gateway__http__0: "http://gateway:8080"
      GATEWAY_HTTPS: "https://gateway:8080"
      GATEWAY_GATEWAYPORT: "http://gateway:8087"
      services__gateway__GatewayPort__0: "http://gateway:8087"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://BKMusic-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "vue"
    ports:
      - "8000"
    networks:
      - "aspire"
  nginx-proxy:
    image: "nginxproxy/nginx-proxy:1.9.0"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: "bind"
        target: "/tmp/docker.sock"
        source: "/var/run/docker.sock"
        read_only: false
      - type: "volume"
        target: "/etc/nginx/certs"
        source: "certs"
        read_only: false
      - type: "volume"
        target: "/etc/nginx/vhost.d"
        source: "vhost"
        read_only: false
      - type: "volume"
        target: "/usr/share/nginx/html"
        source: "html"
        read_only: false
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  bkmusic.apphost-34c3f7955b-redis-data:
    driver: "local"
  bkmusic.apphost-34c3f7955b-messaging-data:
    driver: "local"
  typesense-data:
    driver: "local"
  pgsql_data:
    driver: "local"
  minio-data:
    driver: "local"
  certs:
    driver: "local"
  vhost:
    driver: "local"
  html:
    driver: "local"
