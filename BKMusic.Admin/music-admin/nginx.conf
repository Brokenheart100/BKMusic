server {
    listen 80;
    server_name localhost;

    # === 1. 开启 Gzip 压缩 (企业级标配) ===
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 5;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;
    gzip_vary on;

    # === 2. 静态文件托管 & SPA 路由 ===
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 关键：解决 Vue History 模式刷新 404 问题
        # 如果找不到文件，就返回 index.html，让 Vue 路由去处理
        try_files $uri $uri/ /index.html;
    }

    # === 3. 静态资源缓存优化 (可选) ===
    # Vue 打包后的 assets 带哈希值，可以永久缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # === 4. API 反向代理 (解决 CORS 的核心) ===
    # 浏览器访问 /api/xxx -> Nginx -> Docker 内部的 Gateway:8080
    location /api/ {
        # 注意：这里的 'gateway' 是 Aspire/Docker Compose 中的服务名称
        # 必须与 AppHost.cs 中定义的项目名称一致
        proxy_pass http://gateway:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}